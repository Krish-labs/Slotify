[project]
name = "schedulai-backend"
version = "0.1.0"
description = "SchedulAI Backend - Timetable Management API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.1.0",
    "ortools>=9.8.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "types-redis>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B", "C4", "SIM", "T20"]
ignore = [
    "S101",
    "B008",  # FastAPI Depends() in defaults
    "E501",  # line length is enforced by black
    "E712",  # SQLAlchemy needs `col == True`; ruff's rewrite would break queries
    "UP042",  # (str, Enum) is intentional for SQLAlchemy/Pydantic enums
    "SIM102",
    "B007",
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["F403"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pyright]
extraPaths = ["."]