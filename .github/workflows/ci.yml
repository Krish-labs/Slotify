name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schedulai
          POSTGRES_USER: schedulai
          POSTGRES_PASSWORD: schedulai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schedulai -d schedulai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://schedulai:schedulai@localhost:5432/schedulai
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

      - name: Migrations apply cleanly
        run: alembic upgrade head

      # Recreate the schema from the models for the tests (they use Base.metadata.create_all).
      - name: Reset database before tests
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.core.config import settings

          async def main():
              engine = create_async_engine(settings.DATABASE_URL)
              async with engine.begin() as conn:
                  await conn.execute(text("DROP SCHEMA public CASCADE"))
                  await conn.execute(text("CREATE SCHEMA public"))
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Tests
        run: pytest tests -v -p no:cacheprovider

      # Hard gate: the legacy Column-typing backlog was cleared, so every
      # finding here is a regression, not history.
      - name: Mypy
        run: mypy app

      # Rebuild the schema from the migrations the tests just dropped, then
      # diff the ORM models against it (types + nullability) and run the
      # API-level smoke flow. The service database is disposable.
      - name: PG schema audit
        working-directory: .
        run: |
          python scripts/pg_integration_smoke.py --allow-destructive
          python scripts/pg_schema_audit.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
