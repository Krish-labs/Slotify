# Production Nginx: static SPA + same-origin /api proxy to the backend.
# Same-origin API calls keep HttpOnly auth cookies working without CORS.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Server-level headers cover proxied API responses, redirects, and Nginx
    # errors. The assets location repeats them because its Cache-Control header
    # would otherwise disable inheritance on older Nginx versions.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com" always;

    # TLS terminates outside this HTTP-only container. Set HSTS at that trusted
    # HTTPS edge, where the request scheme is authoritative.

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: immutable hashed filenames from `vite build`.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com" always;
        try_files $uri =404;
    }

    # API proxy: path preserved (/api/v1/... -> backend /api/v1/...).
    # The upstream is resolved per-request (not at startup) so Nginx boots
    # even if the backend container is not ready yet.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Auth cookies pass through untouched (backend sets HttpOnly +
        # SameSite=Lax; Secure is set in production and requires HTTPS
        # termination in front of this server).
    }

    # SPA fallback: every non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
